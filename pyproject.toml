[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zenodotus"
version = "0.3.0"
description = "OSS release-readiness gate: deterministic pre-gates + a no-context reviewer panel"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Kromatic", email = "oss@kromatic.com" }]
keywords = ["open-source", "release", "readiness", "review", "gate", "llm"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Development Status :: 4 - Beta",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Kromatic-Innovation/zenodotus"
Repository = "https://github.com/Kromatic-Innovation/zenodotus"
Issues = "https://github.com/Kromatic-Innovation/zenodotus/issues"

[project.optional-dependencies]
dev = ["pytest", "ruff==0.16.5", "pytest-cov"]
# pip-installable deterministic-floor helper (see docs/CONCEPT.md "Tools wired").
# The Go/Ruby binaries (gitleaks, licensee, scorecard) install out of band.
tools = ["pyroma>=4.2"]
# The default reviewer-panel provider (Anthropic Claude). Imported lazily, so
# the package and its tests run without it; only a live panel run needs it.
llm = ["anthropic>=0.40"]

[project.scripts]
zenodotus = "zenodotus.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/zenodotus"]

[tool.ruff]
line-length = 100
