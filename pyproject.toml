[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zenodotus"
version = "0.0.0"
description = "OSS release-readiness gate: deterministic pre-gates + a no-context reviewer panel"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["open-source", "release", "readiness", "review", "gate", "llm"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Development Status :: 2 - Pre-Alpha",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff", "pytest-cov"]
# pip-installable deterministic-floor helpers (see docs/CONCEPT.md "Tools wired").
# The Go/Ruby binaries (gitleaks, licensee, scorecard) install out of band.
tools = ["pyroma>=4.2", "twine>=5.0"]
# The default reviewer-panel provider (Anthropic Claude). Imported lazily, so
# the package and its tests run without it; only a live panel run needs it.
llm = ["anthropic>=0.40"]

[project.scripts]
zenodotus = "zenodotus.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/zenodotus"]

[tool.ruff]
line-length = 100
