# Dependabot coverage for zenodotus.
#
# Rationale (zenodotus#74, cwc#1549 AC3): the dev-extra lint gate is pinned to
# an exact ruff version in pyproject.toml (`ruff==0.16.0` under
# [project.optional-dependencies].dev). A pin with no bump mechanism silently
# goes stale, so this file exists to propose bump PRs — each bump then arrives
# as its own reviewable diff that shows exactly which new lint rules (or
# behaviour changes) fired, instead of an unbounded range flipping CI red at a
# time nobody chose.
#
# This repo is develop-main (develop is the integration branch, main is the
# published/deploy ref), so bump PRs target `develop`. The pip ecosystem at "/"
# reads pyproject.toml, so every extra that carries the gate — dev (pytest,
# ruff, pytest-cov), tools (pyroma, twine), and llm (anthropic) — is in scope.
# The group list is tailored to THIS repo's dependency set; it is not a copy of
# athenaeum's per-package groups (this repo has no chromadb/fastmcp/pydantic
# stack).
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 6
    groups:
      # Non-breaking bumps of any dependency batch into one PR each.
      pip-patch:
        update-types:
          - "patch"
      pip-minor:
        update-types:
          - "minor"
      # Major bumps of the gates get their own PR so the rule/behaviour delta
      # is reviewed in isolation.
      lint-stack:
        patterns:
          - "ruff"
        update-types:
          - "major"
      test-stack:
        patterns:
          - "pytest"
          - "pytest-*"
        update-types:
          - "major"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 3
